name: Corrección de la app
description: Reporta algo que hay que corregir o mejorar en Difusión
title: "[Corrección] "
labels: ["correccion"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por ayudar a mejorar **Difusión**. Rellena los campos y pulsa
        **Submit new issue**. No necesitas saber programar.
  - type: dropdown
    id: tipo
    attributes:
      label: Tipo de corrección
      options:
        - Visual (colores, tamaños, espacios, orden)
        - Funcional (algo no funciona bien)
        - Rendimiento (va lento o se traba)
        - Mejora o sugerencia
    validations:
      required: true
  - type: input
    id: pantalla
    attributes:
      label: ¿En qué pantalla o parte de la app?
      placeholder: "Ej: Mis Contactos, Ajustes → Sincronizar desde Drive, pantalla de llamada…"
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: ¿Qué pasa ahora?
      description: Describe lo que ves o lo que falla.
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: ¿Qué debería pasar?
      description: Cómo te gustaría que se viera o funcionara.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo (opcional)
      placeholder: "1. Abro Contactos… 2. Toco un filtro… 3. …"
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Versión de la app (opcional)
      placeholder: "Ej: 1.2"
    validations:
      required: false
  - type: dropdown
    id: prioridad
    attributes:
      label: Prioridad
      options:
        - Normal
        - Alta (me impide trabajar)
        - Baja
    validations:
      required: false
  - type: textarea
    id: captura
    attributes:
      label: Captura o nota adicional (opcional)
      description: Puedes arrastrar aquí una imagen de pantalla.
    validations:
      required: false
